services:
  designweek:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DW_DATA_DIR: /data
      DW_ENV: production
      DW_SECURE_COOKIES: "1"
    ports:
      - "127.0.0.1:8926:8000"
    volumes:
      - designweek_private_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=24m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  designweek_private_data: