name: Test DesignWeek application backend
on:
  push:
    paths:
      - 'server/**'
      - 'assets/**'
      - 'index.html'
      - 'tests/**'
      - 'requirements.txt'
      - 'deploy/backup.sh'
      - 'deploy/reset-admin-password.sh'
      - '.github/workflows/backend-ci.yml'
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest httpx
      - run: bash -n deploy/backup.sh deploy/reset-admin-password.sh
      - run: node --check assets/main.js && node --check server/static/editor.js && node --check server/static/login.js
      - run: python -m compileall -q server
      - run: python -m pytest -q tests